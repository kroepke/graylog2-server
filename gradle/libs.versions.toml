# ============================================================
awssdk1-s3  = { module = "com.amazonaws:aws-java-sdk-s3" }
awssdk1-sqs = { module = "com.amazonaws:aws-java-sdk-sqs" }
awssdk1-ec2 = { module = "com.amazonaws:aws-java-sdk-ec2" }
awssdk1-sts = { module = "com.amazonaws:aws-java-sdk-sts" }

# ============================================================
# GCS / Azure (explicit versions; not BOM-managed)
# ============================================================
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage",  version.ref = "googleCloudStorage" }
azure-storage-blob   = { module = "com.azure:azure-storage-blob",           version.ref = "azureBlobStorage" }

# ============================================================
# Retrofit
# ============================================================
retrofit                  = { module = "com.squareup.retrofit2:retrofit",           version.ref = "retrofit" }
retrofit-converter-jackson = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "retrofit" }

# ============================================================
# LDAP
# ============================================================
unboundid-ldapsdk = { module = "com.unboundid:unboundid-ldapsdk", version.ref = "unboundidLdap" }

# ============================================================
# Geo IP
# ============================================================
geoip2 = { module = "com.maxmind.geoip2:geoip2", version.ref = "geoip2" }

# ============================================================
# Cron / Rate limiting
# ============================================================
cron-utils          = { module = "com.cronutils:cron-utils",         version.ref = "cronUtils" }
rate-limited-logger = { module = "com.swrve:rate-limited-logger",    version.ref = "rateLimitedLogger" }

# ============================================================
# Test dependencies
# ============================================================
# JUnit / Mockito (versions from bom-junit / bom-mockito)
junit-jupiter              = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-reporting   = { module = "org.junit.platform:junit-platform-reporting" }
mockito-core               = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter      = { module = "org.mockito:mockito-junit-jupiter" }

# AssertJ (versions managed in parent dependencyManagement as test scope)
assertj-core       = { module = "org.assertj:assertj-core",       version.ref = "assertjCore" }
assertj-joda-time  = { module = "org.assertj:assertj-joda-time",  version.ref = "assertjJodaTime" }

# Hamcrest (version 3.0 from graylog-parent hamcrest.version)
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

# Awaitility
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# Testcontainers (versions from bom-testcontainers)
testcontainers                   = { module = "org.testcontainers:testcontainers" }
testcontainers-elasticsearch     = { module = "org.testcontainers:testcontainers-elasticsearch" }
testcontainers-rabbitmq          = { module = "org.testcontainers:testcontainers-rabbitmq" }
testcontainers-junit-jupiter     = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mongodb           = { module = "org.testcontainers:testcontainers-mongodb" }

# OpenSearch Testcontainers (explicit version; not in testcontainers BOM)
opensearch-testcontainers = { module = "org.opensearch:opensearch-testcontainers", version.ref = "opensearchTestcontainers" }

# ============================================================
# Storage plugin client libraries (added for Task 11)
# ============================================================
# Graylog-shaded Elasticsearch 7 client (published to Maven Central from graylog-shaded project)
elasticsearch7-shaded         = { module = "org.graylog.shaded:elasticsearch7",                      version.ref = "elasticsearch7Shaded" }
elasticsearch7-sniffer-shaded = { module = "org.graylog.shaded:elasticsearch-rest-client-sniffer7",  version.ref = "elasticsearch7Shaded" }
# Graylog-shaded OpenSearch 2 REST client (published to Maven Central)
opensearch2-hlrc-shaded       = { module = "org.graylog.shaded:opensearch2-rest-high-level-client",  version.ref = "opensearch2Shaded" }
opensearch2-sniffer-shaded    = { module = "org.graylog.shaded:opensearch2-rest-client-sniffer",     version.ref = "opensearch2Shaded" }
# OpenSearch Java client (official client from opensearch-project)
opensearch-java-client        = { module = "org.opensearch.client:opensearch-java",                  version.ref = "opensearchJava" }
# Apache HttpComponents 5 (used by OS3 module; version from graylog-parent dependencyManagement)
apache-httpclient5            = { module = "org.apache.httpcomponents.client5:httpclient5",          version.ref = "apacheHttpClient5" }

# REST-Assured (explicit version; not BOM-managed)
rest-assured          = { module = "io.rest-assured:rest-assured",  version.ref = "restAssured" }
rest-assured-json-path = { module = "io.rest-assured:json-path",    version.ref = "restAssured" }

# Guice JUnit 5 extension
guice-extension = { module = "name.falgout.jeffrey.testing.junit5:guice-extension", version.ref = "guiceExtension" }

# Equalsverifier / JSONassert
equalsverifier  = { module = "nl.jqno.equalsverifier:equalsverifier", version.ref = "equalsverifier" }
jsonassert-lib  = { module = "org.skyscreamer:jsonassert",            version.ref = "jsonassert" }

# pkts (for packet parsing in tests)
pkts-core = { module = "io.pkts:pkts-core", version.ref = "pktsCore" }

# Apache Directory API
apache-directory-api           = { module = "org.apache.directory.api:api-all", version.ref = "apacheDirectoryApi" }
apacheds-test-framework        = { module = "org.apache.directory.server:apacheds-test-framework", version.ref = "apacheDs" }
apacheds-ldap-client-test      = { module = "org.apache.directory.server:ldap-client-test",        version.ref = "apacheDs" }
